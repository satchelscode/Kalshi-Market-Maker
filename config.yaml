# Kalshi Market Maker Configuration

api:
  # API key ID from Kalshi dashboard
  key_id: "YOUR_API_KEY_ID"
  # Path to RSA private key file (.pem)
  private_key_path: "kalshi_private_key.pem"
  # Environment: "demo" or "prod"
  environment: "prod"

scanner:
  # Market series to scan (e.g., sports tickers)
  target_series:
    - "KXNCAAMBGAME"    # NCAA Men's basketball moneyline
    - "KXNCAAMBSPREAD"  # NCAA Men's basketball spread
    - "KXNCAAMBTOTAL"   # NCAA Men's basketball total points
    - "KXNCAAWBGAME"    # NCAA Women's basketball moneyline
    - "KXNCAAWBSPREAD"  # NCAA Women's basketball spread
    - "KXNCAAWBTOTAL"   # NCAA Women's basketball total points
    - "KXNBAGAME"       # NBA moneyline (bonus - high volume)
  # Specific market tickers to quote (overrides scanner)
  target_tickers: []
  # Minimum 24h volume to consider a market
  min_volume_24h: 5
  # Minimum open interest
  min_open_interest: 0
  # Maximum number of markets to quote simultaneously
  max_markets: 3
  # Skip markets expiring within this many seconds (600 = 10 min, allows live markets)
  min_time_to_expiry_sec: 600

pricing:
  # Default spread width in cents (target ~5¢ for live markets)
  default_spread_cents: 5
  # Minimum spread width in cents
  min_spread_cents: 3
  # Maximum spread width in cents
  max_spread_cents: 10
  # Price bounds: don't quote outside these ranges (cents)
  min_price: 5
  max_price: 95

quoting:
  # Default order size (number of contracts)
  order_size: 1
  # Maximum orders per side per market
  max_orders_per_side: 1
  # Minimum price change (cents) before requoting
  requote_threshold_cents: 1
  # Order expiration in seconds (0 = no expiration)
  # Short expiration prevents stale one-sided quotes during live games
  order_expiration_sec: 120

risk:
  # Maximum contracts per market (net position)
  max_position_per_market: 3
  # Maximum total portfolio exposure in dollars
  max_total_exposure_dollars: 10
  # Inventory skew factor: how much to shift quotes per unit of inventory
  # At 1.5¢/contract, after 1 fill the spread shifts noticeably to help offload
  skew_cents_per_contract: 1.5

loop:
  # Main loop poll interval in seconds (10s for live market responsiveness)
  poll_interval_sec: 10

logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  # Log to file (in addition to console). Set empty to disable.
  log_file: ""
